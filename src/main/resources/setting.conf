# ==============================================================================
#                    SOMEGRAVES ENTERPRISE CONFIGURATION
# ==============================================================================
# All text strings support Kyori Adventure MiniMessage formatting:
# https://docs.advntr.dev/minimessage/format.html
# Example: <gradient:#ff7675:#fab1a0>Text</gradient>, <gold><b>Bold Gold</b></gold>
# Unicode glyphs and Resource Pack custom fonts are fully supported!

general {
  # Silent startup in server console: if false, prints the SomeGraves banner on startup
  silent-startup = false

  # Automatically find a solid safe block if player dies in lava, void, or mid-air
  auto-safe-location = true

  # Respect vanilla gamerule keepInventory: do not spawn grave if true
  respect-keep-inventory = true

  # Optional custom font namespace for GUI titles and text (leave empty for default)
  # Example: "minecraft:uniform" or "somegraves:gui"
  custom-ui-font = ""
}

worlds {
  # Mode for world filtering (Configurable in setting.conf only):
  # BLACKLIST - Graves will spawn in all worlds EXCEPT those listed below
  # WHITELIST - Graves will ONLY spawn in the worlds listed below
  mode = "BLACKLIST"

  # List of world names to filter
  list = [
    "pvp_arena",
    "minigame_world",
  ]
}

grave {
  # Time in seconds before the gravestone expires. Set to 0 for infinite duration.
  # Default: 1800 (30 minutes). Can also be configured via in-game /sg config.
  duration-seconds = 1800

  # Action when the grave expires:
  # DROP    - Drops all stored items on the ground where the grave was
  # DESTROY - Deletes the items permanently
  expire-action = "DROP"

  # Can other players open and loot another player's gravestone via the chest GUI?
  # true  - Anyone can open and loot other players' graves
  # false - Only the grave owner (or admins with somegraves.bypass.protection) can loot
  allow-loot-others = true

  # Allow the grave OWNER to sneak + right-click for instant looting & auto-equipping
  # This automatically puts armor back in armor slots and offhand in offhand.
  sneak-instant-loot = true

  # Can OTHER players also sneak + right-click to instant-loot another player's grave?
  # false (Default) - Other players can NEVER instant-loot; they must open the chest GUI.
  # true - Other players can also sneak + right-click to instant-loot if allow-loot-others is true.
  allow-others-instant-loot = false

  # Percentage of lost XP to store inside the grave (0.0 to 1.0)
  # 1.0 = 100% of lost XP is preserved in the grave
  # 0.5 = 50% of lost XP is preserved
  # 0.0 = No XP is preserved
  xp-retention-rate = 1.0

  # Protect gravestones from being destroyed by explosions, pistons, fire, lava, or water
  protect-from-damage = true
}

model {
  # Visual appearance model for gravestones:
  # PLAYER_HEAD   - Classic player head block with owner's skin (Default)
  # CHEST         - Vanilla Chest block
  # BARREL        - Vanilla Barrel block
  # ENDER_CHEST   - Vanilla Ender Chest block
  # ITEM_DISPLAY  - Modern Display Entity (ItemDisplay) supporting custom 3D models via CustomModelData
  # BLOCK_DISPLAY - Modern Display Entity (BlockDisplay) with scalable block visuals
  # ARMOR_STAND   - ArmorStand entity equipped with player head and armor
  type = "PLAYER_HEAD"

  # Base material when type = ITEM_DISPLAY
  custom-item-material = "NETHERITE_SWORD"

  # CustomModelData integer when type = ITEM_DISPLAY (for 3D custom grave model resource packs)
  custom-model-data = 0

  # Scale [x, y, z] for ITEM_DISPLAY or BLOCK_DISPLAY entities
  display-scale-x = 1.0
  display-scale-y = 1.0
  display-scale-z = 1.0

  # ArmorStand visual options (used when type = ARMOR_STAND)
  armor-stand-visible = false
  armor-stand-small = false
  armor-stand-arms = true
}

display {
  # Toggle floating hologram text above graves
  enabled = true

  # Distance in blocks for players to see the floating hologram text (e.g. 16, 32, 48, 64 blocks)
  # 16 blocks = 1 chunk, 32 blocks = 2 chunks, 48 blocks = 3 chunks, 64 blocks = 4 chunks
  view-distance-blocks = 48

  # Enable drop shadow on hologram text for maximum readability
  shadowed = true

  # Height offset above the grave block for the TextDisplay hologram
  height-offset = 1.25

  # Billboard mode: CENTER (always faces player), VERTICAL, HORIZONTAL, FIXED
  billboard = "CENTER"

  # Background color of the TextDisplay in ARGB hex format (00000000 for fully transparent, 66000000 for translucent dark backdrop)
  background-color = "00000000"

  # Lines displayed on the gravestone hologram.
  # Available dynamic placeholders:
  # <player_name>   - Name of the owner
  # <killed_by>     - Simplified killer name or environment cause (e.g. Fall, Lava, player2, Zombie)
  # <killer_name>   - Name of the entity/player that killed the owner (or "Environment")
  # <killer_weapon> - Weapon name used by killer (or "None")
  # <death_cause>   - Reason / cause of death
  # <death_date>    - Date / time of death
  # <time_left>     - Remaining duration formatted (MM:ss or HH:mm:ss)
  # <items_count>   - Total count of items stored
  # <xp_stored>     - Amount of XP stored
  # <world>         - World name where grave is placed
  # <x>, <y>, <z>   - Integer coordinates of the grave
  lines = [
    "<gradient:#ff7675:#fab1a0><bold><player_name>'s Grave</bold></gradient>",
    "<gray>Killed by: <red><killed_by></red></gray>",
    "<gray>Items: <yellow><items_count></yellow> | XP: <green><xp_stored></green></gray>",
    "<dark_gray>Expires in: <red><time_left></red></dark_gray>",
    "<dark_purple><i>Right-Click to Open | Sneak+Right-Click to Instant Loot</i></dark_purple>",
  ]
}


sounds {
  # Master toggle to enable or disable all plugin sound effects
  enabled = true

  # Granular sound customization for every in-game event:
  grave-spawn {
    sound = "BLOCK_BELL_USE"
    volume = 1.0
    pitch = 0.8
    enabled = true
  }

  grave-open-chest {
    sound = "BLOCK_CHEST_OPEN"
    volume = 1.0
    pitch = 1.0
    enabled = true
  }

  grave-instant-loot {
    sound = "UI_TOAST_CHALLENGE_COMPLETE"
    volume = 1.0
    pitch = 1.2
    enabled = true
  }

  grave-expire {
    sound = "ENTITY_ITEM_BREAK"
    volume = 1.0
    pitch = 0.5
    enabled = true
  }

  teleport-success {
    sound = "ENTITY_ENDERMAN_TELEPORT"
    volume = 1.0
    pitch = 1.0
    enabled = true
  }

  teleport-fail {
    sound = "BLOCK_NOTE_BLOCK_BASS"
    volume = 1.0
    pitch = 0.5
    enabled = true
  }

  tracking-start {
    sound = "ITEM_LODESTONE_COMPASS_LOCK"
    volume = 1.0
    pitch = 1.2
    enabled = true
  }

  tracking-arrived {
    sound = "ENTITY_PLAYER_LEVELUP"
    volume = 1.0
    pitch = 1.5
    enabled = true
  }

  gui-click {
    sound = "UI_BUTTON_CLICK"
    volume = 0.8
    pitch = 1.0
    enabled = true
  }

  error {
    sound = "BLOCK_NOTE_BLOCK_BASS"
    volume = 1.0
    pitch = 0.5
    enabled = true
  }
}

features {
  # Enable the Grave Teleport Scroll feature
  teleportation-enabled = true

  # Enable the on-screen live compass tracking feature
  tracking-enabled = true
}

scroll {
  # Is the Grave Teleport Scroll enabled?
  enabled = true

  # Item display name
  name = "<gradient:#9d4edd:#e0aaff><bold>Grave Teleport Scroll</bold></gradient>"

  # Item lore
  lore = [
    "<gray>Right-click to view and teleport</gray>",
    "<gray>to your active gravestones.</gray>",
    "",
    "<dark_gray>• Consumed upon teleportation</dark_gray>",
  ]

  # Give the item an enchantment glint
  glow = true

  # Custom Model Data (0 for none)
  custom-model-data = 0

  # Base material for the scroll item
  material = "PAPER"

  # Crafting Recipe configuration (can also be toggled and modified via in-game /somegraves config)
  recipe {
    # Enable or disable the crafting recipe for Grave Teleport Scrolls
    enabled = true

    # If true, ingredients can be placed anywhere in crafting grid (shapeless)
    # If false, requires the fixed 3x3 shape below (shaped)
    shapeless = false

    # 3 lines of 3 characters representing the 3x3 crafting matrix (used when shapeless = false)
    shape = [
      " R ",
      "RSR",
      " R ",
    ]
    # Key mapping character -> Material name (used when shapeless = false)
    ingredients {
      R = "REDSTONE"
      S = "PAPER"
    }

    # List of materials required (used when shapeless = true)
    shapeless-ingredients = [
      "REDSTONE",
      "REDSTONE",
      "REDSTONE",
      "REDSTONE",
      "PAPER",
    ]
  }
}

tracking {
  # How often the tracking Actionbar updates (in server ticks, 20 ticks = 1 second)
  update-ticks = 10

  # Format for the live Actionbar compass
  # Placeholders: <player_name>, <distance>, <direction_arrow>, <x>, <y>, <z>, <world>
  actionbar-format = "<gold><bold>✦ Grave Tracker ✦</bold></gold> <gray>|</gray> <aqua><distance>m</aqua> <yellow><direction_arrow></yellow> <gray>(X: <x>, Y: <y>, Z: <z>)</gray>"

  # Distance in blocks at which the player is considered to have arrived at the grave
  arrived-distance = 2.5
}

messages {
  prefix = "<dark_gray>[<gradient:#9d4edd:#e0aaff><bold>SomeGraves</bold></gradient>]</dark_gray> "
  death-notification = "<red>You died at <yellow><x>, <y>, <z></yellow> in <aqua><world></aqua>!</red> <click:run_command:'/sg track <grave_id>'><hover:show_text:'<green>Click to start tracking your grave!'><gold>[<b>Track Grave</b>]</gold></hover></click>"
  loot-success = "<green>You have successfully looted the gravestone!</green>"
  instant-loot-success = "<green>Instant looted! Equipped your gear and recovered <gold><xp_stored> XP</gold>.</green>"
  loot-denied = "<red>You are not allowed to loot other players' gravestones.</red>"
  teleport-success = "<light_purple>Teleported to your gravestone!</light_purple>"
  teleport-no-scroll = "<red>You need a Grave Teleport Scroll in your inventory to teleport!</red>"
  teleport-disabled = "<red>Teleportation to gravestones is disabled on this server.</red>"
  teleport-confirm = "<yellow>Click again to confirm teleporting to grave at <white><x>, <y>, <z></white> (Consumes 1 Scroll).</yellow>"
  tracking-start = "<green>Tracking started for grave at <yellow><x>, <y>, <z></yellow>. Follow the actionbar compass!</green>"
  tracking-stop = "<yellow>Grave tracking stopped.</yellow>"
  tracking-arrived = "<green><bold>✔ You have arrived at your gravestone!</bold></green>"
  tracking-disabled = "<red>Grave compass tracking is disabled on this server.</red>"
  no-graves = "<yellow>You do not have any active gravestones.</yellow>"
  world-blacklisted = "<yellow>Gravestones are disabled in this world.</yellow>"
  config-reloaded = "<green>Configuration and recipes reloaded successfully!</green>"
  no-permission = "<red>You do not have permission to execute this command.</red>"
  duration-prompt = "<yellow>Please enter the new grave duration in chat (e.g. <white>30m</white>, <white>1h 30m</white>, <white>2d</white>, <white>7200s</white>, or <white>0</white> for infinite). Type <red>cancel</red> to abort.</yellow>"
  duration-updated = "<green>Grave duration updated to: <gold><duration></gold>.</green>"
  duration-cancelled = "<yellow>Grave duration update cancelled.</yellow>"
}
